function contractorArea(){const districts=['Centrum','Podczele','Radzikowo','Port','Uzdrowisko','Zachodnia'];return screen(`${topbar({back:true,wallet:false,bell:false})}<h1 class="h1">Obszar pracy</h1><p class="lead">Wybierz miasto, dzielnice i maksymalny dystans.</p><div class="card"><label class="label">Miasto</label><select class="select" onchange="state.workArea.city=this.value;save()"><option ${state.workArea.city==='Kołobrzeg'?'selected':''}>Kołobrzeg</option><option ${state.workArea.city==='Gdańsk'?'selected':''}>Gdańsk</option></select></div><h2 class="h3 top-space">Twoje dzielnice</h2><div class="card chip-row">${districts.map(d=>`<span class="chip ${state.workArea.districts.includes(d)?'active':''}" onclick="toggleDistrict('${d}')">${d} ${state.workArea.districts.includes(d)?'✓':'＋'}</span>`).join('')}</div><div class="card top-space"><div class="row between"><div><h3 class="h3">Maksymalny dystans</h3><p class="muted small">Ustaw, jak daleko dojeżdżasz do klientów.</p></div><strong class="green" style="font-size:25px"><span id="distLabel">${state.workArea.distance}</span> km</strong></div><input type="range" min="2" max="20" value="${state.workArea.distance}" style="width:100%;accent-color:var(--green)" oninput="document.getElementById('distLabel').textContent=this.value;state.workArea.distance=+this.value;save()"></div><div class="card top-space" style="min-height:180px;background:linear-gradient(145deg,#e5f0e4,#d6e9f1);position:relative;overflow:hidden"><h3 class="h3">Podgląd obszaru</h3><div style="position:absolute;left:22%;top:60%;width:45%;height:45%;border:2px dashed var(--green);border-radius:50%"></div><span style="position:absolute;left:46%;top:58%;font-size:35px">📍</span></div><button class="btn primary wide top-space" onclick="toast('Obszar zapisany')">Zapisz obszar</button>`, 'contractorProfile')}

function contractorCalendar(){const jobs=state.orders.filter(o=>o.status==='scheduled');return screen(`${topbar({back:false})}<h1 class="h1">Kalendarz</h1><p class="lead">Zarządzaj swoimi zleceniami i dostępnością.</p><div class="seg"><button class="active">Kalendarz</button><button onclick="route('contractorAvailability')">Harmonogram</button></div><div class="card calendar top-space">${calendarHTML()}</div><h3 class="h3 top-space">Najbliższe zaplanowane</h3><div class="list">${jobs.map(o=>{const p=prop(o.propertyId);return `<div class="list-row" onclick="state.lastOrderId='${o.id}';route('chat')"><div class="li-icon">⌂</div><div class="grow"><b>${p.name}</b><small>${o.services.join(' + ')}<br>${o.date}, ${o.time}</small></div><span class="chev">›</span></div>`}).join('')||'<div class="empty">Brak zleceń w kalendarzu.</div>'}</div><div class="card row between top-space"><div><b>Dostępność</b><div class="muted">08:00–18:00</div></div><button class="btn outline" onclick="route('contractorAvailability')">Edytuj</button></div>`, 'contractorCalendar')}

function contractorEarnings(){return screen(`${topbar({back:false})}<h1 class="h1">Moje zarobki</h1><p class="lead">Sprawdź saldo, wypłaty i postęp w tym miesiącu.</p><div class="card"><div class="row between"><div><span class="muted">Dostępne środki</span><div class="earnings">${state.contractorWallet} zł</div></div><button class="btn primary" onclick="withdraw()">▰ Wypłać</button></div></div><div class="grid3 top-space"><div class="card stat"><strong>3 245 zł</strong><small>W tym miesiącu</small></div><div class="card stat"><strong>2 280 zł</strong><small>Wypłacono</small></div><div class="card stat"><strong>16 maja</strong><small>Następna wypłata</small></div></div><div class="card top-space"><h3 class="h3">Trend miesięczny</h3><div class="chart"><svg viewBox="0 0 320 150" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#69a986" stop-opacity=".35"/><stop offset="1" stop-color="#69a986" stop-opacity="0"/></linearGradient></defs><path d="M0,140 C20,130 25,110 45,115 S70,95 90,100 S115,75 135,80 S155,62 175,67 S205,35 225,44 S255,20 275,25 S300,8 320,15 L320,150 L0,150Z" fill="url(#g)"/><path d="M0,140 C20,130 25,110 45,115 S70,95 90,100 S115,75 135,80 S155,62 175,67 S205,35 225,44 S255,20 275,25 S300,8 320,15" fill="none" stroke="#00613f" stroke-width="4"/></svg></div><div class="chart-labels"><span>1</span><span>8</span><span>15</span><span>22</span><span>31</span></div></div><div class="card top-space"><h3 class="h3">Ostatnie wypłaty</h3>${[['12 maja','480 zł'],['5 maja','720 zł'],['28 kwietnia','650 zł']].map(([d,a])=>`<div class="list-row"><div class="li-icon">▣</div><div class="grow">${d}</div><b>${a}</b><span class="chev">›</span></div>`).join('')}</div><button class="btn outline wide top-space" onclick="route('contractorPayout')">▭ Konto do wypłat</button>`, 'contractorEarnings')}

function contractorVerify(){return screen(`${topbar({back:true,wallet:false,bell:false})}<h1 class="h1">Weryfikacja i dokumenty</h1><div class="notice"><div class="row"><div style="font-size:40px">✅</div><div><b style="font-size:20px">Twoje konto jest zweryfikowane</b><br><span class="muted">Możesz przyjmować zlecenia w Domerlo.</span></div></div></div><h2 class="h2">Statusy</h2><div class="list">${[['▣','Tożsamość','Zweryfikowana'],['🏦','Rachunek bankowy','Zweryfikowany'],['◈','Szkolenie Domerlo','Ukończone'],['▤','Dane podatkowe','Uzupełnione']].map(([i,t,s])=>`<div class="list-row"><div class="li-icon">${i}</div><div class="grow"><b>${t}</b></div><span class="green">${s}</span><span class="chev">›</span></div>`).join('')}</div><h2 class="h2">Dokumenty</h2><div class="list">${['Dowód tożsamości','Potwierdzenie rachunku','Certyfikat szkolenia'].map(x=>`<div class="list-row"><div class="li-icon">▤</div><div class="grow"><b>${x}</b><small>Dokument dodany</small></div><span class="green">dodano</span><span class="chev">›</span></div>`).join('')}</div><div class="notice top-space">🔒 Poufne dokumenty są widoczne tylko dla Ciebie i zespołu Domerlo.</div>`, 'contractorProfile')}
function openTopup(){openModal(`<h3>Doładuj środki Domerlo</h3><p class="muted">Wybierz kwotę doładowania.</p><div class="chip-row">${[100,250,500,1000].map(n=>`<span class="chip" onclick="document.getElementById('topupAmount').value=${n}">${n} zł</span>`).join('')}</div><input id="topupAmount" class="input top-space" type="number" value="250"><button class="btn primary wide top-space" onclick="topup()">Doładuj</button>`)}
function topup(){const n=+document.getElementById('topupAmount').value||0;if(n<=0)return;if(state.role==='owner')state.ownerWallet+=n;else state.contractorWallet+=n;save();closeModal();render();toast(`Doładowano ${n} zł`)}
function openModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal">${html}<button class="btn ghost wide top-space" onclick="closeModal()">Zamknij</button></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function logout(){state.auth=false;state.view='login';save();render();toast('Wylogowano')}
function render(){if(!state.auth && !['login','register','otp','resetPassword'].includes(state.view))state.view='login';const map={login:loginView,register:registerView,otp:otpView,resetPassword:resetPasswordView,roleSelect:roleSelectView,ownerHome,ownerProperties,addProperty1,addProperty2,order1,order2,order3,order4,order5,searching,contractorFound,orderDone,chat,ownerCalendar,cleaningCalendar,ownerOrders,report,ownerProfile,attention,contractorHome,contractorJobs,contractorOffer,contractorProfile,profileInfo,contractorServices,contractorAvailability,contractorArea,contractorCalendar,contractorReputation,contractorReviews,contractorEarnings,contractorPayout,contractorVerify};const fn=map[state.view]|| (state.role==='owner'?ownerHome:contractorHome);document.getElementById('app').innerHTML=fn();}
render();
